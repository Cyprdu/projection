<style>

<body class="bg-gray-50 min-h-screen">

      <p class="text-sm text-gray-600 mt-2">Fin des votes : <strong>02/10/2025 15:00 (CEST)</strong></p>

      <div id="message" class="mt-3 text-sm text-green-700"></div>

        <div class="flex items-center gap-3">

          <button id="btn-vote" class="px-5 py-2 bg-indigo-600 text-white rounded disabled:opacity-60" disabled>Valider mon vote</button>
        </div>
      </div>

      <section id="results" class="mt-8 hidden bg-white p-6 rounded shadow-sm">
        <h3 class="font-semibold mb-4">Résultats (en direct)</h3>
        <div id="results-list" class="space-y-3"></div>
      </section>
    </main>
  </div>

// ----- RENDER POSTERS -----
function renderPosters() {
  filmsContainer.innerHTML = '';
  films.forEach(name => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded shadow-sm p-2 text-center';
    card.innerHTML = `
      <img class="poster mx-auto w-full h-44 object-cover rounded" src="https://raw.githubusercontent.com/Cyprdu/projection/main/Projection.png" alt="${escapeHtml(name)}">
      <div class="mt-2 font-medium">${escapeHtml(name)}</div>
    `;
    card.querySelector('.poster').addEventListener('click', () => selectFilm(card, name));
    filmsContainer.appendChild(card);
  });
}
