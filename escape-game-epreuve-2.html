<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocole CERBERUS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --color-glow: #00ffff;
            --color-bg: #0d0208;
            --color-text: #e0e0e0;
            --color-prompt: #f0f0f0;
            --color-error: #ff4141;
            --color-success: #00ff41;
            --color-accent: #ff00ff;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 600px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--color-glow);
            box-shadow: 0 0 20px var(--color-glow);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #terminal-output {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 1.1em;
            line-height: 1.6;
        }

        #terminal-output p { margin: 0 0 10px 0; }
        #terminal-output .prompt { color: var(--color-prompt); }
        #terminal-output .response { color: var(--color-glow); }
        #terminal-output .error { color: var(--color-error); }
        #terminal-output .success { color: var(--color-success); }
        #terminal-output .accent { color: var(--color-accent); }

        #input-line {
            display: flex;
            padding: 10px 20px;
            border-top: 1px solid var(--color-glow);
            background-color: #111;
        }

        #input-prompt {
            color: var(--color-success);
            margin-right: 10px;
            white-space: nowrap;
        }

        #user-input {
            flex-grow: 1;
            background-color: transparent;
            border: none;
            color: var(--color-text);
            font-family: inherit;
            font-size: 1.1em;
        }
        #user-input:focus { outline: none; }

        #button-container {
            margin-top: 15px;
        }

        .terminal-button {
            background: transparent;
            border: 1px solid var(--color-glow);
            color: var(--color-glow);
            font-family: inherit;
            font-size: 1em;
            padding: 8px 15px;
            margin: 0 10px 10px 0;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .terminal-button:hover {
            background-color: var(--color-glow);
            color: var(--color-bg);
        }
        
        strong.highlight {
            color: var(--color-accent);
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="terminal">
        <div id="terminal-output"></div>
        <div id="input-line" style="display: none;">
            <span id="input-prompt">></span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');

        const questions = [
            {
                text: "Épreuve 1/4 : Logique Pure. Je n'ai pas de voix, mais je peux tout raconter. Je n'ai pas de corps, mais je peux voyager entre les esprits. Qui suis-je ?",
                type: 'text',
                answer: 'un mot' 
            },
            {
                text: "Épreuve 2/4 : Observation. Mon code de sécurité est affiché ci-dessous. La couleur de l'espoir est mon alliée. Comptez combien de fois elle apparaît. <br><span class='accent'>> ID_SEQ: 7B<span style='color:#00ff41'>A</span>Z<span style='color:#ff4141'>9</span>K<span style='color:#00ff41'>G</span>0<span style='color:#00ff41'>C</span>P4</span>",
                type: 'text',
                answer: '3'
            },
            {
                text: "Épreuve 3/4 : Structure. Face à une porte blindée, quelle approche privilégiez-vous ?",
                type: 'buttons',
                options: ["La Force Brute", "L'Esprit Agile"],
                answer: 1 // Index du bon bouton
            },
            {
                // Ceci n'est pas une question mais le message final.
                text: `Analyse comportementale terminée. Sujet compatible.<br>La clé n'est pas une réponse, mais une action. Un verbe. Un mouvement agile que vous avez prouvé posséder.<br>
                <strong class='highlight'>C</strong>onsultez <strong class='highlight'>a</strong>ttentivement <strong class='highlight'>b</strong>ien <strong class='highlight'>r</strong>apidement <strong class='highlight'>l'o</strong>rdre <strong class='highlight'>e</strong>xact <strong class='highlight'>r</strong>equis.`,
                type: 'final'
            }
        ];
        
        let currentQuestionIndex = 0;

        function typeText(element, text, onComplete) {
            let i = 0;
            const speed = 20; // Vitesse de frappe en ms
            element.innerHTML = '';
            
            function typeWriter() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else if (onComplete) {
                    onComplete();
                }
            }
            typeWriter();
        }
        
        function logToTerminal(html, className = '') {
            const p = document.createElement('p');
            if (className) p.className = className;
            p.innerHTML = html;
            output.appendChild(p);
            output.scrollTop = output.scrollHeight;
        }

        function askQuestion() {
            const question = questions[currentQuestionIndex];
            const p = document.createElement('p');
            p.className = 'prompt';
            output.appendChild(p);

            typeText(p, question.text, () => {
                if (question.type === 'text') {
                    inputLine.style.display = 'flex';
                    userInput.focus();
                } else if (question.type === 'buttons') {
                    inputLine.style.display = 'none';
                    const buttonContainer = document.createElement('div');
                    buttonContainer.id = 'button-container';
                    question.options.forEach((option, index) => {
                        const button = document.createElement('button');
                        button.className = 'terminal-button';
                        button.textContent = option;
                        button.onclick = () => handleAnswer(index);
                        buttonContainer.appendChild(button);
                    });
                    output.appendChild(buttonContainer);
                    output.scrollTop = output.scrollHeight;
                } else if (question.type === 'final') {
                    inputLine.style.display = 'flex';
                    userInput.placeholder = "Entrez la clé finale ici...";
                    userInput.focus();
                }
            });
        }
        
        function handleAnswer(answer) {
            const question = questions[currentQuestionIndex];
            let isCorrect = false;

            if (question.type === 'text') {
                logToTerminal(`> ${answer}`, 'response');
                if (answer.trim().toLowerCase() === question.answer) {
                    isCorrect = true;
                }
            } else if (question.type === 'buttons') {
                logToTerminal(`> Choix : ${question.options[answer]}`, 'response');
                if (answer === question.answer) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                logToTerminal('// Accès autorisé. Passage au niveau suivant...', 'success');
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    setTimeout(askQuestion, 1000);
                }
            } else {
                 logToTerminal('// Accès refusé. Incompatibilité détectée. Réessayez.', 'error');
                 setTimeout(() => {
                    const elementsToRemove = output.querySelectorAll('#button-container, .prompt:last-of-type, .response:last-of-type');
                    elementsToRemove.forEach(e => e.remove());
                    askQuestion();
                 }, 1500);
            }
        }
        
        userInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const answer = userInput.value;
                userInput.value = '';
                
                // Si on est à la dernière étape (le mot de passe final)
                if (questions[currentQuestionIndex].type === 'final') {
                    if (answer.toLowerCase() === 'cabrioler') {
                        logToTerminal(`> ${answer}`, 'response');
                        logToTerminal('*** SYSTÈME DÉVERROUILLÉ ***', 'success');
                        // Mettez ici l'affichage de votre image/QR code
                        output.innerHTML += `<img src="https://github.com/Cyprdu/projection/blob/main/qr_code_escape_game_epreuve_2.png?raw=true" alt="QR Code" style="max-width:150px; margin-top:20px;">`;
                        inputLine.style.display = 'none';
                    } else {
                        logToTerminal(`> ${answer}`, 'response');
                        logToTerminal('// Clé finale incorrecte.', 'error');
                    }
                } else {
                    handleAnswer(answer);
                }
            }
        });
        
        // Démarrage de l'énigme
        typeText(document.createElement('p'), '...', () => {
             logToTerminal('INITIALISATION DU PROTOCOLE DE SÉCURITÉ C.E.R.B.E.R.U.S.');
             setTimeout(() => {
                logToTerminal('Veuillez prouver votre compatibilité pour obtenir la clé d\'accès.');
                setTimeout(askQuestion, 1500);
             }, 1000);
        });

    </script>
</body>
</html>
