<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTÈME V.E.T.O.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --color-glow: #39ff14; /* Vert néon */
            --color-bg: #0d0208;
            --color-text: #e0e0e0;
            --color-prompt: #f0f0f0;
            --color-error: #ff4141;
            --color-success: var(--color-glow);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 600px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-glow);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #terminal-output {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 1.1em;
            line-height: 1.6;
        }

        #terminal-output p { margin: 0 0 10px 0; }
        #terminal-output .prompt { color: var(--color-prompt); font-style: italic; }
        #terminal-output .response { color: var(--color-glow); }
        #terminal-output .error { color: var(--color-error); }
        #terminal-output .success { color: var(--color-success); font-weight: bold; }
        
        #input-line { display: flex; padding: 10px 20px; border-top: 1px solid var(--color-glow); }
        #input-prompt { color: var(--color-success); margin-right: 10px; }
        #user-input { flex-grow: 1; background-color: transparent; border: none; color: var(--color-text); font-family: inherit; font-size: 1.1em; }
        #user-input:focus { outline: none; }
        
        #final-image-container img { max-width: 150px; margin-top: 20px; border: 2px solid var(--color-glow); }

    </style>
</head>
<body>

    <div class="terminal">
        <div id="terminal-output"></div>
        <div id="input-line" style="display: none;">
            <span id="input-prompt">RÉPONSE ></span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        // --- MÉCANISME ANTI-TRICHE ---
        const antiCheatMessage = "Bien tentté mais j'ai un temps d'avance ;), tu ne pourra pas inspecter le code de la page cette fois ci";

        document.addEventListener('contextmenu', event => {
            event.preventDefault();
            alert(antiCheatMessage);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'F12' || 
               (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i')) ||
               (event.ctrlKey && (event.key === 'U' || event.key === 'u'))) {
                event.preventDefault();
                alert(antiCheatMessage);
            }
        });


        // --- LOGIQUE DE L'ÉNIGME ---
        const output = document.getElementById('terminal-output');
        const inputLine = document.getElementById('input-line');
        const userInput = document.getElementById('user-input');
        const inputPrompt = document.getElementById('input-prompt');

        const riddles = [
            {
                text: "Je me glisse entre les mots,<br>Sans moi, tout devient chaos.<br>Muette, mais je fais parler,<br>Qui suis-je, pour séparer ?",
                answer: "espace"
            },
            {
                text: "Je fuis sans bruit, je cours sans jambes,<br>Je suis invisible, mais je vous damne.<br>On me perd, on me gagne,<br>Mais jamais on ne me rattrape.",
                answer: "temps"
            },
            {
                text: "Je suis sans vie, mais je tue,<br>Sans bouche, mais je parle de vous.<br>Je garde tout, mais n’oublie rien,<br>Je suis partout, et parfois malsain.",
                answer: "écran" // Acceptera "ecran" et "écran"
            },
            {
                text: "Je nais de l’ombre et de la lumière,<br>Je suis brève, mais je fais peur.<br>Ni vraie, ni fausse, je suis un leurre,<br>On me voit souvent en songe ou horreur.",
                answer: "ombre"
            }
        ];
        
        let currentRiddleIndex = 0;
        let allRiddlesSolved = false;

        function logToTerminal(html, className = '') {
            const p = document.createElement('p');
            if (className) p.className = className;
            p.innerHTML = html;
            output.appendChild(p);
            output.scrollTop = output.scrollHeight;
        }

        function askRiddle() {
            if (currentRiddleIndex < riddles.length) {
                const riddle = riddles[currentRiddleIndex];
                logToTerminal(`VERROU ${currentRiddleIndex + 1}/4 > ${riddle.text}`, 'prompt');
                inputLine.style.display = 'flex';
                userInput.focus();
            } else {
                allRiddlesSolved = true;
                finalStage();
            }
        }

        function finalStage() {
            inputPrompt.textContent = 'CLÉ FINALE >';
            logToTerminal("SYSTÈME > Tous les verrous conceptuels sont ouverts.", 'success');
            logToTerminal("SYSTÈME > Pour la synchronisation finale, fusionnez les 4 concepts dans leur ordre de découverte.", 'prompt');
            logToTerminal("SYSTÈME > Format attendu : Concept1-Concept2-Concept3-Concept4", 'prompt');
            userInput.focus();
        }
        
        function handleInput() {
            const answer = userInput.value.trim().toLowerCase();
            userInput.value = '';

            if (!answer) return;

            logToTerminal(`> ${answer}`, 'response');
            
            if (allRiddlesSolved) {
                // Vérification de la clé finale
                const finalKey = "espace-temps-écran-ombre";
                if (answer === finalKey) {
                    logToTerminal("SYNCHRONISATION RÉUSSIE. ACCÈS AUTORISÉ.", 'success');
                    const imgContainer = document.createElement('div');
                    imgContainer.id = 'final-image-container';
                    imgContainer.innerHTML = `<img src="https://github.com/Cyprdu/projection/blob/main/qr_code_escape_game_epreuve_2.png?raw=true" alt="QR Code final">`;
                    output.appendChild(imgContainer);
                    inputLine.style.display = 'none'; // Fin du jeu
                } else {
                    logToTerminal("ERREUR DE SYNCHRONISATION. CLÉ INCORRECTE.", 'error');
                }
            } else {
                // Vérification des énigmes
                const currentRiddle = riddles[currentRiddleIndex];
                let isCorrect = false;

                if (currentRiddle.answer === 'écran') {
                    isCorrect = (answer === 'ecran' || answer === 'écran');
                } else {
                    isCorrect = (answer === currentRiddle.answer);
                }

                if (isCorrect) {
                    logToTerminal(`VERROU ${currentRiddleIndex + 1} OUVERT.`, 'success');
                    currentRiddleIndex++;
                    setTimeout(askRiddle, 1000);
                } else {
                    logToTerminal("ACCÈS REFUSÉ. RÉPONSE INCORRECTE.", 'error');
                }
            }
        }

        userInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                handleInput();
            }
        });
        
        // Démarrage de l'énigme
        logToTerminal("DÉMARRAGE DU SYSTÈME V.E.T.O. (Verrouillage Espace-Temps-Ombre)...");
        setTimeout(() => {
            logToTerminal("Calibration des capteurs de réalité...");
            setTimeout(() => {
                logToTerminal("Veuillez répondre aux protocoles de sécurité pour continuer.");
                setTimeout(askRiddle, 1500);
            }, 1000);
        }, 1000);

    </script>
</body>
</html>
