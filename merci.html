<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci ! - Courts Métrages Lycée Lalande</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        /* Réinitialisation de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0d12; /* Fond très sombre */
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Empêche la barre de défilement */
            position: relative;
        }

        /* --- L'animation de la boule floue --- */
        .blob {
            position: absolute;
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: linear-gradient(135deg, #ff007a, #7a00ff); /* Couleurs dynamiques */
            border-radius: 50%;
            filter: blur(100px); /* Le flou extrême */
            z-index: 1;
            opacity: 0.7;
            /* Animation de mouvement */
            animation: float 10s infinite alternate ease-in-out;
        }

        /* Clés de l'animation pour faire bouger la boule */
        @keyframes float {
            0% {
                transform: translate(-20%, -20%) scale(0.8);
            }
            50% {
                transform: translate(20%, 10%) scale(1.1);
            }
            100% {
                transform: translate(-10%, 30%) scale(0.9);
            }
        }

        /* --- Le conteneur en verre (Glassmorphism) --- */
        .glass-container {
            position: relative;
            z-index: 2; /* Pour être au-dessus de la boule */
            background: rgba(255, 255, 255, 0.05); /* Fond légèrement blanc transparent */
            backdrop-filter: blur(16px); /* Floute ce qui est derrière le conteneur */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); /* Bordure subtile */
            padding: 4rem 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Le grand "Merci" */
        h1 {
            font-family: 'Dancing Script', cursive; /* Police manuscrite élégante */
            font-size: 6rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        /* Le texte principal */
        p.message {
            font-size: 1.4rem;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Mise en valeur du chiffre 183 */
        .highlight {
            font-size: 3rem;
            font-weight: 600;
            display: block;
            margin: 15px 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Petit mot de fin */
        .footer-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <div class="glass-container">
        <h1>Merci</h1>
        <p class="message">
            Vous avez été 
            <span class="highlight">183 personnes</span>
            à venir voir les courts métrages du <strong>Lycée Lalande</strong> !
        </p>
        <p class="footer-text">
            Toute l'équipe est extrêmement touchée par votre présence.
        </p>
    </div>

</body>
</html>
