<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vote - Projection 2025</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .poster { cursor:pointer; transition: transform .2s; }
    .poster.selected { outline:3px solid #e94560; transform: translateY(-6px); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-4">Votez pour votre court-métrage préféré</h1>
    <p class="text-center text-sm text-gray-600">Clôture des votes : <b>02/10/2025 - 15h00</b></p>
    <div id="countdown" class="text-center mt-2 text-indigo-700 font-semibold"></div>
    <div id="message" class="text-center mt-3 text-green-600"></div>

    <section id="films" class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-6"></section>

    <div class="flex justify-between mt-6">
      <button id="btn-view-results" class="px-4 py-2 bg-white border rounded shadow">Voir résultats</button>
      <button id="btn-vote" class="px-5 py-2 bg-indigo-600 text-white rounded disabled:opacity-50" disabled>Valider mon vote</button>
    </div>

    <section id="results" class="mt-8 hidden bg-white p-6 rounded shadow">
      <h3 class="font-semibold mb-4">Résultats</h3>
      <div id="results-list" class="space-y-2"></div>
    </section>
  </div>

<script>
// === CONFIGURATION AIRTABLE ===
const AIRTABLE_TOKEN = "patfaiLK9KaGI0wVF.5379c37b1ee9ac9a665f981473d523e8e3004ced12be7531d8273b7aa3608a40";
const AIRTABLE_BASE = "appLkFCKB7ys0zr7j";
const AIRTABLE_TABLE = "Films";
const API_URL = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(AIRTABLE_TABLE)}`;

// === CONFIG SITE ===
const films = [
  "Moins par Moins","Impulsion","La Vie Rêvée","Lettre à un amour","Nature Morte",
  "Un Dernier Regard","The other woman","The Middle of the World","Errance","Brouillon",
  "Léopoldine","BOKEH","Accident"
];
const COUNTDOWN_TARGET = new Date("2025-10-02T15:00:00+02:00");
const VOTED_KEY = "film_voted";
let selectedFilm = null;

// === AFFICHAGE DES FILMS ===
function renderFilms(){
  const c=document.getElementById("films");
  c.innerHTML="";
  films.forEach(name=>{
    const d=document.createElement("div");
    d.className="bg-white rounded shadow p-2 text-center";
    d.innerHTML=`<img class="poster mx-auto w-full h-40 object-cover rounded" src="https://raw.githubusercontent.com/Cyprdu/projection/main/Projection.png"><div class="mt-2 font-medium">${name}</div>`;
    d.querySelector(".poster").addEventListener("click",()=>selectFilm(d,name));
    c.appendChild(d);
  });
}
function selectFilm(card,name){
  if(hasVoted()||isEnded())return;
  document.querySelectorAll(".poster").forEach(p=>p.classList.remove("selected"));
  card.querySelector(".poster").classList.add("selected");
  selectedFilm=name;
  document.getElementById("btn-vote").disabled=false;
}
function hasVoted(){return !!localStorage.getItem(VOTED_KEY);}
function isEnded(){return new Date()>=COUNTDOWN_TARGET;}

// === COMPTE À REBOURS ===
function updateCountdown(){
  const now=new Date(); const diff=COUNTDOWN_TARGET-now;
  if(diff<=0){document.getElementById("countdown").textContent="Votes terminés";return;}
  const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),
        m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  document.getElementById("countdown").textContent=`${d}j ${h}h ${m}m ${s}s`;
}
setInterval(updateCountdown,1000);updateCountdown();

// === ACTION VOTE ===
document.getElementById("btn-vote").addEventListener("click",async()=>{
  if(!selectedFilm)return alert("Choisis un film !");
  try {
    // Cherche le film
    const resFind = await fetch(`${API_URL}?filterByFormula={Name}='${selectedFilm}'`,{
      headers:{Authorization:`Bearer ${AIRTABLE_TOKEN}`}
    });
    const dataFind=await resFind.json();
    if(!dataFind.records||!dataFind.records.length)return alert("Film introuvable !");
    const rec=dataFind.records[0];
    const current=rec.fields.Votes||0;

    // Incrémente le compteur
    const resUpdate=await fetch(`${API_URL}/${rec.id}`,{
      method:"PATCH",
      headers:{
        "Authorization":`Bearer ${AIRTABLE_TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({fields:{Votes:current+1}})
    });
    const dataUpdate=await resUpdate.json();

    localStorage.setItem(VOTED_KEY,JSON.stringify({film:selectedFilm}));
    document.getElementById("message").textContent=`Merci ! Tu as voté pour "${selectedFilm}".`;
    showResults();
  } catch(e){
    alert("Erreur: "+e.message);
  }
});

// === VOIR LES RÉSULTATS ===
document.getElementById("btn-view-results").addEventListener("click",showResults);

async function showResults(){
  document.getElementById("results").classList.remove("hidden");
  const res=await fetch(API_URL,{headers:{Authorization:`Bearer ${AIRTABLE_TOKEN}`}});
  const data=await res.json();
  const list=document.getElementById("results-list");list.innerHTML="";
  data.records.sort((a,b)=>(b.fields.Votes||0)-(a.fields.Votes||0)).forEach(r=>{
    const row=document.createElement("div");
    row.className="flex justify-between";
    row.innerHTML=`<span>${r.fields.Name}</span><span>${r.fields.Votes||0} votes</span>`;
    list.appendChild(row);
  });
}

// === INIT ===
renderFilms();
if(hasVoted()){const v=JSON.parse(localStorage.getItem(VOTED_KEY));document.getElementById("message").textContent=`Tu as déjà voté pour "${v.film}".`;}
</script>
</body>
</html>
