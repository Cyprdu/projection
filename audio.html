<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Looper avec Player.js</title>
    
    <script src="https://projection-2025.netlify.app/playeraudio.js" type="text/javascript"></script>

    <style>
        /* --- Palette Thème Sombre --- */
        :root {
            --primary-color: #0d6efd;
            --background-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted-color: #888;
            --handle-color: #dc3545;
            --progress-bar-bg-color: #333;
            --handle-size: 20px;
            --progress-bar-height: 8px;
        }

        /* --- Styles Généraux --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 1rem;
            box-sizing: border-box;
        }

        /* --- Conteneur Principal --- */
        .looper-container {
            width: 100%;
            max-width: 500px;
            background: var(--surface-color);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        /* --- Section de Contrôle --- */
        .control-section {
            margin-bottom: 1.5rem;
        }
        
        .control-section h2 {
            font-size: 1rem;
            color: var(--text-muted-color);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        /* --- Style des Inputs de Fichier --- */
        .file-input-label {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .file-input-label:hover {
            background-color: #0b5ed7;
        }
        input[type="file"] {
            display: none;
        }
        .file-name {
            text-align: center;
            font-style: italic;
            color: var(--text-muted-color);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            word-break: break-all;
            min-height: 1rem;
        }
        
        /* --- Lecteur Audio Principal --- */
        .main-player audio {
            width: 100%;
            margin-top: 1rem;
        }
        
        /* --- Barre de Progression Personnalisée --- */
        .progress-container {
            position: relative;
            width: 100%;
            height: var(--handle-size);
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 1rem;
        }

        .progress-bar-bg {
            position: absolute;
            width: 100%;
            height: var(--progress-bar-height);
            background-color: var(--progress-bar-bg-color);
            border-radius: var(--progress-bar-height);
        }

        .progress-bar-current {
            position: absolute;
            height: var(--progress-bar-height);
            background-color: var(--primary-color);
            border-radius: var(--progress-bar-height);
            left: 0;
            width: 0;
        }
        
        .loop-range {
            position: absolute;
            height: var(--progress-bar-height);
            background-color: rgba(13, 110, 253, 0.4);
            left: 0;
            right: 0;
        }

        /* --- Poignées de Boucle --- */
        .loop-handle {
            position: absolute;
            width: var(--handle-size);
            height: var(--handle-size);
            background-color: var(--handle-color);
            border: 2px solid white;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .loop-handle:active {
            cursor: grabbing;
        }
        #start-handle { left: 0%; }
        #end-handle { left: 100%; }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted-color);
            margin-top: 0.5rem;
        }

        /* --- Conteneur pour Player.js --- */
        #bg-player-container {
            margin-top: 1rem;
            min-height: 40px; /* Espace réservé pour le lecteur */
        }
        
    </style>
</head>
<body>

<div class="looper-container">
    <h1>🎧 Audio Looper</h1>

    <div class="control-section main-player">
        <h2>1. Piste à répéter</h2>
        <label for="main-audio-input" class="file-input-label">Charger un fichier audio (.mp3, .m4a)</label>
        <input type="file" id="main-audio-input" accept=".mp3,.m4a">
        <div id="main-file-name" class="file-name">Aucun fichier chargé</div>
        
        <div class="progress-container">
            <div class="progress-bar-bg"></div>
            <div class="loop-range" id="loop-range"></div>
            <div class="progress-bar-current" id="current-progress"></div>
            <div class="loop-handle" id="start-handle" draggable="true"></div>
            <div class="loop-handle" id="end-handle" draggable="true"></div>
        </div>
        <div class="time-display">
            <span id="current-time">00:00</span>
            <span id="duration">00:00</span>
        </div>
        
        <audio id="main-audio" controls loop></audio>
    </div>

    <hr style="border: none; border-top: 1px solid #333; margin: 2rem 0;">
    
    <div class="control-section bg-player">
        <h2>2. Musique de fond (Player.js)</h2>
        <label for="bg-audio-input" class="file-input-label">Charger une musique de fond</label>
        <input type="file" id="bg-audio-input" accept=".mp3,.m4a">
        <div id="bg-file-name" class="file-name">Aucun fichier chargé</div>
        
        <div id="bg-player-container"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Éléments DOM Piste Principale ---
    const mainAudio = document.getElementById('main-audio');
    const mainAudioInput = document.getElementById('main-audio-input');
    const mainFileName = document.getElementById('main-file-name');
    
    const progressContainer = document.querySelector('.progress-container');
    const currentProgress = document.getElementById('current-progress');
    const loopRange = document.getElementById('loop-range');
    const startHandle = document.getElementById('start-handle');
    const endHandle = document.getElementById('end-handle');
    const currentTimeDisplay = document.getElementById('current-time');
    const durationDisplay = document.getElementById('duration');

    // --- Éléments DOM Musique de Fond ---
    const bgAudioInput = document.getElementById('bg-audio-input');
    const bgFileName = document.getElementById('bg-file-name');
    let bgPlayerInstance = null; // Pour garder une référence au lecteur

    let loopStart = 0, loopEnd = 0, isDraggingStart = false, isDraggingEnd = false;

    // --- Fonctions ---
    const formatTime = (seconds) => {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    // --- Chargement Piste Principale ---
    mainAudioInput.addEventListener('change', () => {
        const file = mainAudioInput.files[0];
        if (file) {
            mainAudio.src = URL.createObjectURL(file);
            mainFileName.textContent = file.name;
            mainAudio.addEventListener('loadedmetadata', () => {
                loopEnd = mainAudio.duration;
                durationDisplay.textContent = formatTime(mainAudio.duration);
                updateHandlesAndRange();
            }, { once: true });
        }
    });

    // --- Chargement Piste de Fond et initialisation de Player.js ---
    bgAudioInput.addEventListener('change', () => {
        const file = bgAudioInput.files[0];
        if (!file) return;

        bgFileName.textContent = file.name;

        // Création d'une URL locale pour le fichier
        const fileURL = URL.createObjectURL(file);
        
        // Si un lecteur existe déjà, on le détruit (en vidant le conteneur)
        // La documentation de PlayerJS ne spécifie pas de méthode destroy(), 
        // donc vider le conteneur est une approche sûre.
        document.getElementById('bg-player-container').innerHTML = '';

        // 3. Initialisation du lecteur avec le fichier local
        bgPlayerInstance = new Playerjs({
            id: "bg-player-container", // L'ID du conteneur
            file: fileURL,
            title: file.name // On peut même afficher le titre dans le lecteur
        });
    });
    
    // --- Logique Piste Principale ---
    mainAudio.addEventListener('timeupdate', () => {
        if (!mainAudio.duration) return;
        const progressPercent = (mainAudio.currentTime / mainAudio.duration) * 100;
        currentProgress.style.width = `${progressPercent}%`;
        currentTimeDisplay.textContent = formatTime(mainAudio.currentTime);
        
        if (mainAudio.currentTime >= loopEnd || mainAudio.currentTime < loopStart) {
            mainAudio.currentTime = loopStart;
            if(mainAudio.paused) mainAudio.play();
        }
    });

    mainAudio.addEventListener('seeking', () => {
        if (mainAudio.currentTime < loopStart) {
           mainAudio.currentTime = loopStart;
        }
    });

    // --- Gestion des Poignées de Boucle (Drag & Drop) ---
    const updateHandlesAndRange = () => {
        if (!mainAudio.duration) return;
        const startPercent = (loopStart / mainAudio.duration) * 100;
        const endPercent = (loopEnd / mainAudio.duration) * 100;
        const handleWidth = getComputedStyle(startHandle).width;

        startHandle.style.left = `calc(${startPercent}% - ${handleWidth} / 2)`;
        endHandle.style.left = `calc(${endPercent}% - ${handleWidth} / 2)`;
        loopRange.style.left = `${startPercent}%`;
        loopRange.style.width = `${endPercent - startPercent}%`;
    };

    const startDrag = (e, handle) => {
        e.preventDefault();
        if (handle === 'start') isDraggingStart = true;
        if (handle === 'end') isDraggingEnd = true;
        document.body.style.userSelect = 'none';
    };

    const stopDrag = () => {
        isDraggingStart = false;
        isDraggingEnd = false;
        document.body.style.userSelect = '';
    };
    
    const onDrag = (e) => {
        if (!isDraggingStart && !isDraggingEnd || !mainAudio.duration) return;
        
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));

        if (isDraggingStart) {
            const newStart = percent * mainAudio.duration;
            loopStart = Math.min(newStart, loopEnd - 0.1);
        }
        if (isDraggingEnd) {
            const newEnd = percent * mainAudio.duration;
            loopEnd = Math.max(newEnd, loopStart + 0.1);
        }
        updateHandlesAndRange();
    };
    
    // Souris
    startHandle.addEventListener('mousedown', (e) => startDrag(e, 'start'));
    endHandle.addEventListener('mousedown', (e) => startDrag(e, 'end'));
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
    
    // Tactile
    startHandle.addEventListener('touchstart', (e) => startDrag(e, 'start'), { passive: false });
    endHandle.addEventListener('touchstart', (e) => startDrag(e, 'end'), { passive: false });
    document.addEventListener('touchmove', onDrag);
    document.addEventListener('touchend', stopDrag);

    updateHandlesAndRange();
});
</script>

</body>
</html>
