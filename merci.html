<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci ! - Courts Métrages du Lycée Lalande</title>
    <style>
        /* Réinitialisation de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Style de la page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fond sombre "cinéma" */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Conteneur principal */
        .container {
            background-color: #1e1e1e;
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            border-top: 5px solid #e50914; /* Touche de rouge cinéma */
        }

        /* Le grand "Merci" */
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Le texte principal */
        p.message {
            font-size: 1.5rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: #e0e0e0;
        }

        /* Mise en valeur du chiffre 180 */
        .highlight {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f5c518; /* Couleur or/jaune */
            display: block;
            margin: 10px 0;
        }

        /* Petit mot de fin */
        .footer-text {
            font-size: 1.1rem;
            color: #888888;
            margin-top: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Merci.</h1>
        <p class="message">
            Vous avez été 
            <span class="highlight">180 personnes</span>
            à venir voir les courts métrages du <strong>Lycée Lalande</strong> !
        </p>
        <p class="footer-text">
            Toute l'équipe vous remercie pour votre présence et votre soutien.
        </p>
    </div>

</body>
</html>
