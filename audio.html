<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Audio en Boucle</title>
    <style>
        /* --- Styles Généraux --- */
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --handle-color: #dc3545;
            --handle-size: 20px;
            --progress-bar-height: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: #333;
            padding: 1rem;
            box-sizing: border-box;
        }

        /* --- Conteneur Principal --- */
        .looper-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        /* --- Section de Contrôle --- */
        .control-section {
            margin-bottom: 1.5rem;
        }
        
        .control-section h2 {
            font-size: 1rem;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        /* --- Style des Inputs de Fichier --- */
        .file-input-label {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .file-input-label:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        .file-name {
            text-align: center;
            font-style: italic;
            color: var(--secondary-color);
            margin-top: 0.5rem;
            font-size: 0.9rem;
            word-break: break-all;
        }

        /* --- Lecteur Audio Principal --- */
        .main-player audio {
            width: 100%;
            margin-top: 1rem;
        }
        
        /* --- Barre de Progression Personnalisée --- */
        .progress-container {
            position: relative;
            width: 100%;
            height: var(--handle-size);
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 1rem;
        }

        .progress-bar-bg {
            position: absolute;
            width: 100%;
            height: var(--progress-bar-height);
            background-color: #e9ecef;
            border-radius: var(--progress-bar-height);
        }

        .progress-bar-current {
            position: absolute;
            height: var(--progress-bar-height);
            background-color: var(--primary-color);
            border-radius: var(--progress-bar-height);
            left: 0;
            width: 0;
        }
        
        .loop-range {
            position: absolute;
            height: var(--progress-bar-height);
            background-color: rgba(0, 123, 255, 0.3);
            left: 0;
            right: 0;
        }

        /* --- Poignées de Boucle (Curseurs) --- */
        .loop-handle {
            position: absolute;
            width: var(--handle-size);
            height: var(--handle-size);
            background-color: var(--handle-color);
            border: 2px solid white;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .loop-handle:active {
            cursor: grabbing;
        }

        #start-handle {
            left: 0%; /* Initial position */
        }

        #end-handle {
            left: 100%; /* Initial position */
        }
        
        /* --- Affichage des Temps --- */
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--secondary-color);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

<div class="looper-container">
    <h1>🎧 Audio Looper</h1>

    <div class="control-section main-player">
        <h2>1. Piste à répéter</h2>
        <label for="main-audio-input" class="file-input-label">Charger un fichier audio (.mp3, .m4a)</label>
        <input type="file" id="main-audio-input" accept=".mp3,.m4a">
        <div id="main-file-name" class="file-name">Aucun fichier chargé</div>
        
        <div class="progress-container">
            <div class="progress-bar-bg"></div>
            <div class="loop-range" id="loop-range"></div>
            <div class="progress-bar-current" id="current-progress"></div>
            <div class="loop-handle" id="start-handle" draggable="true"></div>
            <div class="loop-handle" id="end-handle" draggable="true"></div>
        </div>
        <div class="time-display">
            <span id="current-time">00:00</span>
            <span id="duration">00:00</span>
        </div>
        
        <audio id="main-audio" controls loop></audio>
    </div>

    <hr style="border: none; border-top: 1px solid #eee; margin: 2rem 0;">
    
    <div class="control-section bg-player">
        <h2>2. Musique de fond (Optionnel)</h2>
        <label for="bg-audio-input" class="file-input-label">Charger une musique de fond</label>
        <input type="file" id="bg-audio-input" accept=".mp3">
        <div id="bg-file-name" class="file-name">Aucun fichier chargé</div>
        <audio id="bg-audio" controls style="width:100%; margin-top: 1rem;"></audio>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Éléments DOM ---
    const mainAudio = document.getElementById('main-audio');
    const bgAudio = document.getElementById('bg-audio');
    
    const mainAudioInput = document.getElementById('main-audio-input');
    const bgAudioInput = document.getElementById('bg-audio-input');
    
    const mainFileName = document.getElementById('main-file-name');
    const bgFileName = document.getElementById('bg-file-name');

    const progressContainer = document.querySelector('.progress-container');
    const currentProgress = document.getElementById('current-progress');
    const loopRange = document.getElementById('loop-range');
    
    const startHandle = document.getElementById('start-handle');
    const endHandle = document.getElementById('end-handle');
    
    const currentTimeDisplay = document.getElementById('current-time');
    const durationDisplay = document.getElementById('duration');

    // --- État de l'application ---
    let loopStart = 0; // en secondes
    let loopEnd = 0;   // en secondes
    let isDraggingStart = false;
    let isDraggingEnd = false;

    // --- Fonctions Utilitaires ---
    const formatTime = (seconds) => {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    // --- Chargement des Fichiers Audio ---
    const loadAudio = (inputElement, audioElement, fileNameElement) => {
        const file = inputElement.files[0];
        if (file) {
            const fileURL = URL.createObjectURL(file);
            audioElement.src = fileURL;
            fileNameElement.textContent = file.name;
            if (audioElement === mainAudio) {
                 audioElement.addEventListener('loadedmetadata', () => {
                    loopEnd = audioElement.duration;
                    durationDisplay.textContent = formatTime(audioElement.duration);
                    updateHandlesAndRange();
                }, { once: true });
            }
        }
    };
    
    mainAudioInput.addEventListener('change', () => loadAudio(mainAudioInput, mainAudio, mainFileName));
    bgAudioInput.addEventListener('change', () => loadAudio(bgAudioInput, bgAudio, bgFileName));

    // --- Logique de Lecture et de Boucle ---
    mainAudio.addEventListener('timeupdate', () => {
        if (!mainAudio.duration) return;

        // Mise à jour de la barre de progression
        const progressPercent = (mainAudio.currentTime / mainAudio.duration) * 100;
        currentProgress.style.width = `${progressPercent}%`;
        currentTimeDisplay.textContent = formatTime(mainAudio.currentTime);
        
        // Logique de la boucle
        if (mainAudio.currentTime >= loopEnd || mainAudio.currentTime < loopStart) {
            mainAudio.currentTime = loopStart;
        }
    });
    
    // Synchroniser la musique de fond avec la piste principale
    mainAudio.addEventListener('play', () => {
        if (bgAudio.src && bgAudio.paused) bgAudio.play();
    });
    mainAudio.addEventListener('pause', () => {
        if (!bgAudio.paused) bgAudio.pause();
    });
    mainAudio.addEventListener('seeking', () => {
        if (mainAudio.currentTime < loopStart) {
           mainAudio.currentTime = loopStart;
        }
    });

    // --- Mise à Jour des Poignées et de la Plage de Boucle ---
    const updateHandlesAndRange = () => {
        if (!mainAudio.duration) return;
        
        const startPercent = (loopStart / mainAudio.duration) * 100;
        const endPercent = (loopEnd / mainAudio.duration) * 100;

        startHandle.style.left = `calc(${startPercent}% - ${getComputedStyle(startHandle).width} / 2)`;
        endHandle.style.left = `calc(${endPercent}% - ${getComputedStyle(endHandle).width} / 2)`;
        
        loopRange.style.left = `${startPercent}%`;
        loopRange.style.width = `${endPercent - startPercent}%`;
    };

    // --- Gestion du Glisser-Déposer des Poignées ---
    const startDrag = (e, handle) => {
        e.preventDefault();
        if (handle === 'start') isDraggingStart = true;
        if (handle === 'end') isDraggingEnd = true;
    };

    const stopDrag = () => {
        isDraggingStart = false;
        isDraggingEnd = false;
    };
    
    const onDrag = (e) => {
        if (!isDraggingStart && !isDraggingEnd) return;
        if (!mainAudio.duration) return;
        
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let percent = (clientX - rect.left) / rect.width;
        percent = Math.max(0, Math.min(1, percent)); // Clamp between 0 and 1

        if (isDraggingStart) {
            const newStart = percent * mainAudio.duration;
            // Empêcher la poignée de départ de dépasser celle de fin
            if (newStart < loopEnd - 0.1) { // 0.1s buffer
                loopStart = newStart;
            } else {
                loopStart = loopEnd - 0.1;
            }
        }
        
        if (isDraggingEnd) {
            const newEnd = percent * mainAudio.duration;
            // Empêcher la poignée de fin de passer avant celle de départ
            if (newEnd > loopStart + 0.1) {
                loopEnd = newEnd;
            } else {
                loopEnd = loopStart + 0.1;
            }
        }
        updateHandlesAndRange();
    };
    
    // Écouteurs d'événements pour la souris
    startHandle.addEventListener('mousedown', (e) => startDrag(e, 'start'));
    endHandle.addEventListener('mousedown', (e) => startDrag(e, 'end'));
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
    
    // Écouteurs d'événements pour le tactile (iPhone, etc.)
    startHandle.addEventListener('touchstart', (e) => startDrag(e, 'start'));
    endHandle.addEventListener('touchstart', (e) => startDrag(e, 'end'));
    document.addEventListener('touchmove', onDrag);
    document.addEventListener('touchend', stopDrag);

    // Initialisation
    updateHandlesAndRange();
});
</script>

</body>
</html>
