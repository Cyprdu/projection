<script>
// ==== VARIABLES POPUP ====
const votePopup = document.getElementById("vote-popup");
const voteOverlay = document.getElementById("vote-overlay");
const popupPoster = document.getElementById("popup-poster");
const cancelVote = document.getElementById("cancel-vote");
const confirmVote = document.getElementById("confirm-vote");

let selectedCard = null; // pour la carte sélectionnée

// ==== MODIFIER LA SÉLECTION DES FILMS ====
function selectFilm(card, name, affiche){
    if(hasVoted()) return;
    document.querySelectorAll(".poster").forEach(p=>p.classList.remove("selected"));
    card.querySelector(".poster").classList.add("selected");
    selectedFilm = name;
    selectedCard = card;
    document.getElementById("btn-vote").disabled=false;

    // Met à jour l'image dans la popup
    popupPoster.src = affiche;
}

// ==== SUR LE BOUTON VOTER ====
document.getElementById("btn-vote").addEventListener("click",(e)=>{
    if(!selectedFilm) return alert("Choisis un film !");
    // Ouvre la popup au lieu d'envoyer directement
    votePopup.style.display = "block";
    voteOverlay.style.display = "block";
});

// ==== ANNULER VOTE ====
cancelVote.addEventListener("click",()=>{
    votePopup.style.display = "none";
    voteOverlay.style.display = "none";
});

// ==== CONFIRMER VOTE ====
confirmVote.addEventListener("click", async ()=>{
    votePopup.style.display = "none";
    voteOverlay.style.display = "none";

    // Animation check simplifiée
    selectedCard.querySelector(".poster").classList.add("selected"); // garde effet lueur
    selectedCard.innerHTML += `<div class="check-animation absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[#e94560] text-5xl animate-bounce">✔</div>`;

    // Petite pause pour animation
    setTimeout(async ()=>{
        // Envoi vote via API
        try {
            const res = await fetch(API_URL,{
                method:"POST",
                headers:{
                    "Authorization":`Bearer ${AIRTABLE_TOKEN}`,
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({fields:{Film:selectedFilm}})
            });
            const data = await res.json();
            if(res.ok){
                localStorage.setItem(VOTED_KEY,JSON.stringify({film:selectedFilm}));
                window.location.href = "resultat.html";
            } else {
                alert("Erreur: "+(data.error?.message||"inconnue"));
            }
        } catch(e){ alert("Erreur: "+e.message); }
    }, 800);
});

// ==== EMPÊCHER INSPECT ====
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("keydown", e=>{
    if(e.key==="F12" || (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase()))) {
        window.location.href="index.html";
    }
});
</script>
